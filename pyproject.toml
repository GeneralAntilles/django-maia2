[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "django-maia2"
version = "0.1.4"
description = "A reusable Django app implementing the MAIA-2 interoceptive awareness questionnaire."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ryan Abel" }]
keywords = ["django", "questionnaire", "maia", "interoception", "psychometrics"]
dependencies = [
    "Django>=5.2,<6.0",
    "django-meta",
    "djangorestframework",
    "django-crispy-forms",
    "crispy-bootstrap5",
    "Pillow",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/GeneralAntilles/django-maia2"

[tool.setuptools.packages.find]
include = ["maia_v2", "maia_v2.*"]

[tool.setuptools.package-data]
# Runtime assets only — ship the compiled main.css, JS, and OG image, but NOT
# the SCSS / vendored Bootstrap sources (not needed at runtime; bootstrap/ is
# gitignored so it wouldn't exist in a clean clone anyway).
maia_v2 = [
    "templates/**/*",
    "static/css/main.css",
    "static/*.js",
    "static/media/*",
    "fixtures/*.json",
    "fixtures/*.txt",
]
